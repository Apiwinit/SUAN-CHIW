<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plants | สวนฉว.</title>
  <link rel="stylesheet" href="style.css">
  <script src="plants.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">สวนฉว.</a>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="plants.html" class="active">พืช</a>
      <a href="animals.html">สัตว์</a>
    </nav>
  </header>

  <main>
    <section class="page-banner">
      <p class="subtitle">PLANT DATABASE</p>
      <h1>🌿 ฐานข้อมูลพืช</h1>
      <p>รวบรวมพืชและต้นไม้ที่พบภายในโรงเรียน</p>
    </section>

    <section class="database-section">
      <div class="database-heading">
        <div>
          <h2>พืชที่สำรวจพบ</h2>
          <p>เรียนรู้ลักษณะและข้อมูลทางชีววิทยาของพืช</p>
        </div>
        <span class="count-label" id="plant-count">0 รายการ</span>
      </div>

      <div class="search-box">
        <input type="search" id="plant-search" placeholder="ค้นหาชื่อพืชหรือชื่อวิทยาศาสตร์..." aria-label="ค้นหาพืช">
      </div>

      <div class="plant-grid" id="plant-list"></div>
      <p class="empty-message" id="empty-message" hidden>ไม่พบข้อมูลพืชที่ค้นหา</p>
    </section>
  </main>

  <div class="modal" id="plant-modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="detail-name">
      <button class="modal-close" id="modal-close" aria-label="ปิด">×</button>
      <img id="detail-image" src="" alt="ภาพพืช" hidden>
      <div class="modal-info">
        <h2 id="detail-name"></h2>
        <p class="scientific" id="detail-scientific"></p>
        <h3>ลักษณะทั่วไป</h3><p id="detail-description"></p>
        <h3>การจำแนกทางชีววิทยา</h3><p id="detail-classification"></p>
        <h3>บริเวณที่พบ</h3><p id="detail-location"></p>
      </div>
    </div>
  </div>

  <footer><p>สวนฉว. | โครงงานความหลากหลายทางชีวภาพภายในโรงเรียน</p></footer>
</body>
</html>
